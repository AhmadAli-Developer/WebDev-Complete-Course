<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tutorial 18</title>
    <style>
        
        .box{
            background-color: rgb(84, 127, 127);
        }
       .box1{
        color: yellowgreen;
        padding: 10px;
        margin: 55px;
        border: 2px solid blue;
        height: 200px;
        box-sizing: border-box;

       } 
       .box2{
        color: burlywood; 
        padding: 10px;
        margin: 25px;
        border: 2px solid rgb(214, 7, 7);
        height: 200px;
        box-sizing: border-box;
       }

    </style>
</head>
<body>
    <h1>We learn about Box Model</h1>
    <div class="box box1">I am a box</div>
    <div class="box box2">I am another box</div>
</body>
</html>
