<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tutorial 17</title>
    <style>
        /* Element Selector*/
        div{
            background-color: red;
        }
        /* Class Selector*/
        .yellow{
            background-color: aquamarine;
        }
        /* ID Selector*/
        #green{
            background-color: green;
        }
        /* Child Selector */
        div > p{
            color: blue;
            background-color: tomato;
        }
      /*  Descendent Selector */
      div p{
        color: blue;
        background-color: chocolate;
      }
      /* Universal Selector */
      *{
        margin: 0%;
        padding: 0%;
      }
      /* Pseudo Selector */
      a:visited{
        color: pink;
      }
      a:link{
        color: aqua;
      }
      a:active{
        background-color: blue;
      }
      a:hover{
        background-color: rgb(212, 97, 97);
      }
      p:first-child{
        background-color: chartreuse;
      }
    </style>
</head>
<body>
    <h1>CSS Selectors</h1>
    <main class="one">
        <p>I am a first Child</p>
        <p>I am a Second Child</p>
    </main>
    <div class="yellow">
        I am a div
        <article>
            <p>I am a para inside article</p>
        </article>
        <!--<p>I am a para inside div</p>-->
    </div>
    <div id="green">
        I am another div
    </div>
    <a href="https://www.google.com">Go to Google</a>
    <a href="https://www.Instagram.com">Go to Instagram</a>
</body>
</html>
